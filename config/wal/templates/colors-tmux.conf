set -g status-style "bg={color0},fg={foreground}"
set -g status-left "#[fg={color5},bold]  #S  "
set -g status-right "#[fg={color4}] %d %b #[fg={color5}] %H:%M "
setw -g window-status-current-format "#[fg={color0},bg={color5},bold] #I:#W "
setw -g window-status-format "#[fg={color8}] #I:#W "
set -g pane-border-style "fg={color8}"
set -g pane-active-border-style "fg={color5}"
set -g message-style "bg={color0},fg={color5},bold"
