# --- Borde: giro más lento + resplandor del color del tema ---
animation = borderangle, 1, 80, liner, loop
decoration {
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = $wal5a
        color_inactive = rgba(00000055)
    }
}

# --- Animaciones de capas: rofi, menús y notificaciones con rebote ---
animation = layersIn, 1, 4, overshot, popin 85%
animation = layersOut, 1, 3, smoothOut, popin 85%
animation = fadeLayersIn, 1, 4, default
animation = fadeLayersOut, 1, 3, default

# --- Desenfoque detrás de la barra, rofi y las notificaciones ---
layerrule = blur on, match:namespace ^(waybar|rofi|notifications)$
layerrule = ignore_alpha 0.2, match:namespace ^(waybar|rofi|notifications)$
