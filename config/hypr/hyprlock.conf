# Basado en el layout 9 de Hyprlock-Dots (mahaveergurjar), adaptado a pywal
source = /home/g0nxz/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    grace = 2
}

# Fondo activo, sin desenfoque
background {
    monitor =
    path = /home/g0nxz/.cache/wal/lock-bg.png
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# Tarjeta principal
shape {
    monitor =
    size = 500, 500
    color = $card
    rounding = 30
    border_size = 0
    position = 0, -70
    halign = center
    valign = center
}

# Avatar sobre el borde superior de la tarjeta
image {
    monitor =
    path = /home/g0nxz/.face
    size = 100
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 170
    halign = center
    valign = center
}

# Nombre
label {
    monitor =
    text = <b>$USER</b>
    color = $fg
    font_size = 20
    font_family = Sans
    position = 0, 80
    halign = center
    valign = center
}

# Hora
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +%H:%M)</b>"
    color = $fg
    font_size = 60
    font_family = Sans
    position = 0, -20
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date '+%A, %d de %B')</b>"
    color = $fg
    font_size = 19
    font_family = Sans
    position = 0, -90
    halign = center
    valign = center
}

# Píldora de usuario
shape {
    monitor =
    size = 320, 55
    color = $pill
    rounding = -1
    border_size = 0
    position = 0, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰀄   <b>$USER</b>
    color = $fg
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}

# Píldora de contraseña
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(00000000)
    inner_color = $pill
    font_color = $fg
    check_color = $green
    fail_color = $red
    capslock_color = $red
    fade_on_empty = false
    placeholder_text = <i>   Contraseña</i>
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>
    hide_input = false
    position = 0, -268
    halign = center
    valign = center
}
