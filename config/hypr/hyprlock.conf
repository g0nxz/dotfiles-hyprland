source = /home/g0nxz/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = /home/g0nxz/.cache/wal/lock-bg.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.4
    vignette = true
    vignette_opacity = 0.5
}

# Hora grande
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    color = rgba(ffffffff)
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:1000] date '+%A, %d de %B'
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = $accent
    position = 0, 70
    halign = center
    valign = center
}

# Panel sutil solo detrás del campo
shape {
    monitor =
    size = 320, 70
    color = $panel
    rounding = 18
    border_size = 2
    border_color = $accentborder
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 0
    rounding = 14
    inner_color = rgba(00000000)
    font_color = rgba(ffffffff)
    check_color = $green
    fail_color = $red
    placeholder_text =    Contraseña
    fail_text = Incorrecta
    dots_center = true
}

# Usuario abajo
label {
    monitor =
    text =    $USER
    font_size = 15
    color = $fgdim
    position = 0, 50
    halign = center
    valign = bottom
}
