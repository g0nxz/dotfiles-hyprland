source = /home/g0nxz/.cache/wal/colors-hypr.conf
# Monitores
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = DP-1, 1920x1080@60, 1920x0, 1 

# NVIDIA (Wayland)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRAY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GL_GSYNC_ALLOWED,0
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# Cursor por software
cursor {
	no_hardware_cursors = true
}

input {
	kb_layout = es
}

# Estilo terminal
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = $wal4 $wal6 45deg
    col.inactive_border = $wal0
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 3
        passes = 2
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0a0a12ee)
    }
}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 5, overshot, slidevert
}

exec-once = hyprlock
exec-once = waybar
exec-once = ghostty
exec-once = dunst
exec-once = ~/.config/hypr/wallpaper.sh
exec-once = flameshot

### Atajos de teclado
$mod = SUPER
bind = $mod, RETURN, exec, ghostty
bind = $mod, Q, killactive
bind = $mod, SPACE, exec, rofi -show drun
bind = $mod, M, exit

# Cambiar de workspace
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Mover la ventana a un workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Impr Pant → captura con flameshot
bind = , Print, exec, flameshot gui

# Wlogout
bind = $mod SHIFT, X, exec, wlogout -b 5

# Bloquear pantalla
bind = $mod, L, exec, hyprlock

# --- Reglas de ventana ---
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(flameshot)$
windowrule = float on, match:title ^(Abrir archivo)$
windowrule = float on, match:title ^(Guardar como)$
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 50% 55%, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = center 1, match:class ^(org.pulseaudio.pavucontrol)$

# Selector de wallpapers de Rofi
bind = $mod, W, exec, ~/.config/hypr/wallselect.sh
exec-once = sunshine

# --- Volumen (teclas multimedia) ---
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/volumen up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/volumen down
bindl  = , XF86AudioMute,        exec, ~/.local/bin/volumen mute

# Animación de entrada de las notificaciones de dunst
layerrule = animation popin 80%, match:namespace notifications
source = ~/.config/hypr/estetica.conf
